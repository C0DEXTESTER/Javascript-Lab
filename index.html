<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab Assignments</title>
    <!-- PrismJS Dark Theme for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e; /* VS Code dark background */
            color: #cccccc;
            overflow: hidden; /* Prevent full page scrolling */
        }
        
        /* Two-pane layout container */
        #app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar Styling (File Explorer) */
        #sidebar {
            width: 280px;
            background-color: #252526; /* VS Code sidebar color */
            border-right: 1px solid #333;
            overflow-y: auto;
            padding-top: 10px;
        }
        
        .sidebar-title {
            font-size: 0.85em;
            text-transform: uppercase;
            padding: 10px 15px;
            color: #999;
            letter-spacing: 1px;
        }

        /* Tree List Styling */
        ul.tree-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.tree-list ul {
            padding-left: 20px; /* Indent subfolders */
        }
        
        .tree-item {
            padding: 6px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 0.95em;
            user-select: none;
            color: #cccccc;
        }
        .tree-item:hover {
            background-color: #2a2d2e;
        }
        .tree-item.active {
            background-color: #37373d;
            color: #ffffff;
        }
        .icon {
            margin-right: 8px;
            font-size: 1.1em;
            width: 20px;
            text-align: center;
        }

        /* Main Editor Area */
        #editor-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }

        /* Top Bar of the Editor */
        #editor-tabs {
            background-color: #2d2d2d;
            padding: 10px 20px;
            font-size: 0.9em;
            color: #999;
            border-bottom: 1px solid #1e1e1e;
            min-height: 20px;
        }

        /* Code Viewer Area */
        #viewer {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        pre {
            margin: 0 !important;
            border-radius: 5px;
            background: transparent !important;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Sidebar (Left) -->
        <div id="sidebar">
            <div class="sidebar-title">Explorer: JS Assignments</div>
            <div id="file-tree">Loading repository...</div>
        </div>

        <!-- Editor (Right) -->
        <div id="editor-container">
            <div id="editor-tabs">Welcome</div>
            <div id="viewer">
                <p style="color: #666;">Select a file from the sidebar to view your code.</p>
            </div>
        </div>
    </div>

    <!-- Syntax Highlighting Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <script>
        // REPLACE THESE WITH YOUR EXACT GITHUB DETAILS
        const username = 'C0DEXTESTER';
        const repo = 'Javascript-Lab';

        // Load the root directory when the page opens
        loadRoot();

        async function loadRoot() {
            const treeContainer = document.getElementById('file-tree');
            treeContainer.innerHTML = '';
            
            const rootUl = document.createElement('ul');
            rootUl.className = 'tree-list';
            treeContainer.appendChild(rootUl);

            await fetchAndBuildTree('', rootUl);
        }

        // Fetch directory contents and build the collapsible list
        async function fetchAndBuildTree(path, parentElement) {
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();

                // Sort: Folders first, files second
                data.sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                });

                data.forEach(item => {
                    // Ignore index.html and hidden files like .git
                    if (item.name === 'index.html' || item.name.startsWith('.')) return;

                    const li = document.createElement('li');
                    const div = document.createElement('div');
                    div.className = 'tree-item';
                    
                    const isDir = item.type === 'dir';
                    div.innerHTML = `<span class="icon">${isDir ? '📁' : '📄'}</span> ${item.name}`;
                    
                    if (isDir) {
                        div.onclick = () => toggleFolder(div, item.path);
                    } else {
                        div.onclick = () => {
                            highlightActiveFile(div);
                            viewFile(item);
                        };
                    }
                    
                    li.appendChild(div);
                    parentElement.appendChild(li);
                });
            } catch (error) {
                parentElement.innerHTML = '<li style="padding: 10px; color: red;">Error loading repository files. Check username/repo in the code.</li>';
                console.error(error);
            }
        }

        // Handle expanding and collapsing folders in the sidebar
        async function toggleFolder(element, path) {
            const nestedList = element.nextElementSibling;
            const iconSpan = element.querySelector('.icon');

            // If the folder was already clicked once, just hide/show it
            if (nestedList && nestedList.tagName === 'UL') {
                const isHidden = nestedList.style.display === 'none';
                nestedList.style.display = isHidden ? 'block' : 'none';
                iconSpan.textContent = isHidden ? '📂' : '📁';
                return;
            }

            // If clicking for the first time, change icon to open and fetch contents
            iconSpan.textContent = '📂';
            const ul = document.createElement('ul');
            ul.className = 'tree-list';
            ul.innerHTML = '<li class="tree-item" style="color: #666;">Loading...</li>';
            element.parentNode.insertBefore(ul, element.nextSibling);

            ul.innerHTML = ''; // Clear loading text
            await fetchAndBuildTree(path, ul);
        }

        // Display the selected file in the right-hand editor pane
        async function viewFile(fileData) {
            const viewer = document.getElementById('viewer');
            const tabs = document.getElementById('editor-tabs');
            
            tabs.textContent = fileData.path; // Show file path at the top
            viewer.innerHTML = '<p style="color:#999;">Loading file content...</p>';

            const ext = fileData.name.split('.').pop().toLowerCase();
            const downloadUrl = fileData.download_url;

            // Display Images
            if (['png', 'jpg', 'jpeg', 'gif', 'svg'].includes(ext)) {
                viewer.innerHTML = `<img src="${downloadUrl}" alt="${fileData.name}">`;
            } 
            // Handle PDFs
            else if (ext === 'pdf') {
                viewer.innerHTML = `
                    <p style="color:#d4d4d4; font-size: 1.1em;">PDF preview is not supported inside the code editor.</p>
                    <a href="${fileData.html_url}" target="_blank" style="color:#4fc1ff; text-decoration: none; padding: 10px; border: 1px solid #4fc1ff; border-radius: 3px; display: inline-block; margin-top: 10px;">
                        Open PDF in GitHub
                    </a>`;
            } 
            // Display Code (JS, HTML, CSS, JSON, etc.)
            else {
                try {
                    const response = await fetch(downloadUrl);
                    const text = await response.text();
                    
                    let lang = ext === 'html' ? 'markup' : ext === 'css' ? 'css' : ext === 'json' ? 'json' : 'javascript';
                    const escapedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    
                    viewer.innerHTML = `<pre><code class="language-${lang}">${escapedText}</code></pre>`;
                    Prism.highlightAll(); // Trigger syntax coloring
                } catch(e) {
                    viewer.innerHTML = '<p style="color:red;">Error loading file content.</p>';
                }
            }
        }

        // Make the clicked file turn slightly lighter gray in the sidebar
        function highlightActiveFile(clickedElement) {
            document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
            clickedElement.classList.add('active');
        }
    </script>
</body>
</html>
