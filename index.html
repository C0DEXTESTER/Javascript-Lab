<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab Assignments</title>
    <!-- PrismJS Dark Theme for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #cccccc;
            overflow: hidden;
        }
        
        #app-container { display: flex; height: 100vh; width: 100vw; }

        /* Sidebar Styling */
        #sidebar {
            width: 300px;
            background-color: #252526;
            border-right: 1px solid #333;
            overflow-y: auto;
            padding-top: 10px;
            flex-shrink: 0;
        }
        
        .sidebar-title {
            font-size: 0.85em;
            text-transform: uppercase;
            padding: 10px 15px;
            color: #999;
            letter-spacing: 1px;
        }

        ul.tree-list { list-style: none; padding: 0; margin: 0; }
        ul.tree-list ul { padding-left: 20px; }
        
        .tree-item {
            padding: 6px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 0.95em;
            user-select: none;
            color: #cccccc;
        }
        .tree-item:hover { background-color: #2a2d2e; }
        .tree-item.active { background-color: #37373d; color: #ffffff; }
        .icon { margin-right: 8px; font-size: 1.1em; width: 20px; text-align: center; }

        /* Editor Area */
        #editor-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            overflow: hidden;
        }

        #editor-tabs {
            background-color: #2d2d2d;
            padding: 10px 20px;
            font-size: 0.9em;
            color: #999;
            border-bottom: 1px solid #1e1e1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn {
            background: #007acc;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            display: none;
        }
        .action-btn:hover { background: #005999; }

        #viewer {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        pre { margin: 0 !important; border-radius: 5px; background: transparent !important; }
        img { max-width: 100%; height: auto; border-radius: 5px; }
        iframe { width: 100%; height: 100%; border: none; background: white; border-radius: 5px; }
        
        /* Markdown formatting inside viewer */
        .markdown-body { color: #cccccc; line-height: 1.6; }
        .markdown-body h1, .markdown-body h2 { border-bottom: 1px solid #333; padding-bottom: 5px; }
        .markdown-body a { color: #4fc1ff; }
        .markdown-body code { background: #2d2d2d; padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-title">Explorer: JS Assignments</div>
            <div id="file-tree">Loading repository...</div>
        </div>

        <!-- Editor -->
        <div id="editor-container">
            <div id="editor-tabs">
                <span id="tab-title">Welcome</span>
                <button id="preview-btn" class="action-btn" onclick="toggleHtmlPreview()">Preview Live HTML</button>
            </div>
            <div id="viewer">
                <p style="color: #666;">Select a file or your "javascript work" folder from the sidebar to view your code.</p>
            </div>
        </div>
    </div>

    <!-- Scripts for Syntax Highlighting and Markdown Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        const username = 'C0DEXTESTER';
        const repo = 'Javascript-Lab';
        
        let currentHtmlUrl = '';
        let isPreviewing = false;
        let currentHtmlCode = '';

        loadRoot();

        async function loadRoot() {
            const treeContainer = document.getElementById('file-tree');
            treeContainer.innerHTML = '';
            const rootUl = document.createElement('ul');
            rootUl.className = 'tree-list';
            treeContainer.appendChild(rootUl);
            await fetchAndBuildTree('', rootUl);
        }

        async function fetchAndBuildTree(path, parentElement) {
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();

                data.sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                });

                data.forEach(item => {
                    if (item.name === 'index.html' || item.name.startsWith('.')) return;

                    const li = document.createElement('li');
                    const div = document.createElement('div');
                    div.className = 'tree-item';
                    
                    const isDir = item.type === 'dir';
                    div.innerHTML = `<span class="icon">${isDir ? '📁' : '📄'}</span> ${item.name}`;
                    
                    if (isDir) {
                        div.onclick = () => toggleFolder(div, item.path);
                    } else {
                        div.onclick = () => {
                            highlightActiveFile(div);
                            viewFile(item);
                        };
                    }
                    
                    li.appendChild(div);
                    parentElement.appendChild(li);
                });
            } catch (error) {
                parentElement.innerHTML = '<li style="padding: 10px; color: red;">Error loading repository files.</li>';
            }
        }

        async function toggleFolder(element, path) {
            const nestedList = element.nextElementSibling;
            const iconSpan = element.querySelector('.icon');

            // This acts as your "Go Back" / Collapse feature
            if (nestedList && nestedList.tagName === 'UL') {
                const isHidden = nestedList.style.display === 'none';
                nestedList.style.display = isHidden ? 'block' : 'none';
                iconSpan.textContent = isHidden ? '📂' : '📁';
                return;
            }

            iconSpan.textContent = '📂';
            const ul = document.createElement('ul');
            ul.className = 'tree-list';
            ul.innerHTML = '<li class="tree-item" style="color: #666;">Loading...</li>';
            element.parentNode.insertBefore(ul, element.nextSibling);

            ul.innerHTML = ''; 
            await fetchAndBuildTree(path, ul);
        }

        async function viewFile(fileData) {
            const viewer = document.getElementById('viewer');
            const tabTitle = document.getElementById('tab-title');
            const previewBtn = document.getElementById('preview-btn');
            
            tabTitle.textContent = fileData.path; 
            viewer.innerHTML = '<p style="color:#999;">Loading file content...</p>';
            previewBtn.style.display = 'none'; 
            isPreviewing = false;

            const ext = fileData.name.split('.').pop().toLowerCase();
            const downloadUrl = fileData.download_url;

            if (['png', 'jpg', 'jpeg', 'gif', 'svg'].includes(ext)) {
                viewer.innerHTML = `<img src="${downloadUrl}" alt="${fileData.name}">`;
            } 
            else if (ext === 'pdf') {
                viewer.innerHTML = `
                    <p style="color:#d4d4d4;">PDF preview is not supported inside the editor.</p>
                    <a href="${fileData.html_url}" target="_blank" style="color:#4fc1ff; text-decoration: none; padding: 10px; border: 1px solid #4fc1ff; display: inline-block;">Open PDF in GitHub</a>`;
            } 
            else {
                try {
                    const response = await fetch(downloadUrl);
                    const text = await response.text();
                    
                    // Render Markdown Files (like README.md) visually
                    if (ext === 'md') {
                        viewer.innerHTML = `<div class="markdown-body">${marked.parse(text)}</div>`;
                    } 
                    else {
                        // Display Code
                        let lang = ext === 'html' ? 'markup' : ext === 'css' ? 'css' : ext === 'json' ? 'json' : 'javascript';
                        const escapedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        const codeHTML = `<pre><code class="language-${lang}">${escapedText}</code></pre>`;
                        
                        viewer.innerHTML = codeHTML;
                        Prism.highlightAll(); 

                        // If HTML, enable the preview toggle button
                        if (ext === 'html') {
                            currentHtmlCode = codeHTML;
                            // GitHub pages direct URL construction
                            currentHtmlUrl = `https://${username}.github.io/${repo}/${fileData.path}`;
                            previewBtn.style.display = 'block';
                            previewBtn.textContent = 'Preview Live HTML';
                        }
                    }
                } catch(e) {
                    viewer.innerHTML = '<p style="color:red;">Error loading file content.</p>';
                }
            }
        }

        // Toggle between code view and rendered HTML view
        function toggleHtmlPreview() {
            const viewer = document.getElementById('viewer');
            const previewBtn = document.getElementById('preview-btn');
            
            if (!isPreviewing) {
                viewer.innerHTML = `<iframe src="${currentHtmlUrl}"></iframe>`;
                previewBtn.textContent = 'View Source Code';
                isPreviewing = true;
            } else {
                viewer.innerHTML = currentHtmlCode;
                Prism.highlightAll();
                previewBtn.textContent = 'Preview Live HTML';
                isPreviewing = false;
            }
        }

        function highlightActiveFile(clickedElement) {
            document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
            clickedElement.classList.add('active');
        }
    </script>
</body>
</html>
